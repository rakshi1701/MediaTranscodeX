name: Build Cross-Platform Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0, v1.0.1, etc.

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: Media_TranscodeX-Linux.AppImage
          - os: windows-latest
            artifact_name: Media_TranscodeX-Windows.zip
          - os: macos-latest
            artifact_name: Media_TranscodeX-macOS.dmg

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. Linux Setup & AppImage Build ---
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake pkg-config qt6-base-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev

      - name: Build Linux (AppImage)
        if: runner.os == 'Linux'
        run: |
          mkdir build_ci && cd build_ci
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          cd ..
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable build_ci/Media_TranscodeX --output appimage
          mv Media_TranscodeX*.AppImage Media_TranscodeX-Linux.AppImage

      # --- 2. Windows Setup & ZIP Build ---
      - name: Install Windows Dependencies
        if: runner.os == 'Windows'
        run: |
          vcpkg install ffmpeg:x64-windows qtbase:x64-windows

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir build_ci && cd build_ci
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build . --config Release
          windeployqt --no-compiler-runtime Release/Media_TranscodeX.exe
          cd Release
          7z a ../../Media_TranscodeX-Windows.zip *

      # --- 3. macOS Setup & DMG Build ---
      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install qt@6 ffmpeg cmake

      - name: Build macOS (.dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir build_ci && cd build_ci
          cmake .. -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" -DCMAKE_BUILD_TYPE=Release
          make -j$(sysctl -n hw.ncpu)
          macdeployqt Media_TranscodeX.app -dmg
          mv Media_TranscodeX.dmg ../Media_TranscodeX-macOS.dmg

      # --- 4. Upload Artifacts to GitHub Release ---
      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}