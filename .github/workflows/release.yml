name: Build & Release CI/CD Pipeline

on:
  push:
    branches: [ "Main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "Main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: Media_TranscodeX-Linux.AppImage
          - os: windows-latest
            artifact_name: Media_TranscodeX-Windows.zip
          - os: macos-latest
            artifact_name: Media_TranscodeX-macOS.dmg

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. Linux Setup & AppImage Build ---
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake pkg-config qt6-base-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libfuse2 imagemagick

      - name: Build Linux (AppImage)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          mkdir build_ci && cd build_ci
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          cd ..

          # Create minimal desktop metadata file required by linuxdeploy
          cat << 'EOF' > Media_TranscodeX.desktop
          [Desktop Entry]
          Type=Application
          Name=Media_TranscodeX
          Exec=Media_TranscodeX
          Icon=Media_TranscodeX
          Categories=AudioVideo;Utility;
          EOF

          # Create placeholder icon file
          mkdir -p icons
          convert -size 128x128 xc:blue icons/Media_TranscodeX.png || touch icons/Media_TranscodeX.png

          # Download and run linuxdeploy
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable build_ci/Media_TranscodeX \
            --desktop-file Media_TranscodeX.desktop \
            --icon-file icons/Media_TranscodeX.png \
            --output appimage

          mv Media_TranscodeX*.AppImage Media_TranscodeX-Linux.AppImage

      # --- 2. macOS Setup & DMG Build ---
      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install qt@6 ffmpeg cmake

      - name: Build macOS (.dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir build_ci && cd build_ci
          cmake .. -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" -DCMAKE_BUILD_TYPE=Release
          make -j$(sysctl -n hw.ncpu)
          
          # Locate macdeployqt from Homebrew path
          MACDEPLOYQT="$(brew --prefix qt@6)/bin/macdeployqt"
          
          # Package as native macOS disk image (.dmg)
          "$MACDEPLOYQT" Media_TranscodeX.app -dmg
          mv Media_TranscodeX.dmg ../Media_TranscodeX-macOS.dmg

      # --- 3. Windows Setup & ZIP Build ---
      - name: Install Windows Dependencies & Build
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install ffmpeg:x64-windows qtbase:x64-windows
          mkdir build_ci && cd build_ci
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
          cmake --build . --config Release

          WINDEPLOYQT=$(find /c/vcpkg -name "windeployqt.exe" | head -n 1)
          if [ -n "$WINDEPLOYQT" ]; then
            "$WINDEPLOYQT" --no-compiler-runtime Release/Media_TranscodeX.exe
          fi

          cd Release
          7z a ../../Media_TranscodeX-Windows.zip *

      # --- 4. Upload Artifacts to Release or CI Build ---
      - name: Upload Artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact (CI Workflow)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}